name: Trigger Private Repo Update

on:
  push:
    branches:
      - main

jobs:
  ping-private-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Send Repository Dispatch Event
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dtdungtb/private-test/dispatches \
            -d '{"event_type": "update_submodule_content", "client_payload": {"public_commit_msg": "${{ github.event.head_commit.message }}"}}'